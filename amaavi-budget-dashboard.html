<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMAAVI Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --card2:#F5F5F7; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --sep:rgba(60,60,67,.12); --label:#1D1D1F; --label2:#6E6E73; --label3:#AEAEB2;
  --accent:#FF6B1A; --pos:#FF3B30; --neg:#248A3D; --ok:#248A3D;
  --g0:#007AFF; --g1:#FF9500; --g2:#30B0C7; --g3:#FF2D55; --g4:#AF52DE; --g5:#32ADE6; --g6:#A2845E; --g7:#34C759; --g8:#8E8E93; --g9:#5856D6;
  --past:#C7C7CC; --shadow:0 1px 1px rgba(0,0,0,.02),0 4px 16px rgba(0,0,0,.04);
  --r:22px; --r2:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.14);
    --sep:rgba(255,255,255,.08); --label:#F5F5F7; --label2:#98989D; --label3:#636366;
    --accent:#FF7A2F; --pos:#FF453A; --neg:#30D158; --ok:#30D158;
    --g0:#0A84FF; --g1:#FF9F0A; --g2:#40C8E0; --g3:#FF375F; --g4:#BF5AF2; --g5:#64D2FF; --g6:#AC8E68; --g7:#30D158; --g8:#8E8E93; --g9:#7D7AFF;
    --past:#48484A; --shadow:none;
  }
}
:root[data-theme="dark"]{
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.14);
    --sep:rgba(255,255,255,.08); --label:#F5F5F7; --label2:#98989D; --label3:#636366;
    --accent:#FF7A2F; --pos:#FF453A; --neg:#30D158; --ok:#30D158;
    --g0:#0A84FF; --g1:#FF9F0A; --g2:#40C8E0; --g3:#FF375F; --g4:#BF5AF2; --g5:#64D2FF; --g6:#AC8E68; --g7:#30D158; --g8:#8E8E93; --g9:#7D7AFF;
    --past:#48484A; --shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;transition:background .3s}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
.tn{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid color-mix(in srgb,var(--g0) 55%,transparent);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--sep);background:var(--bg)}
.app{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;margin-bottom:6px;border-bottom:1px solid var(--sep)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--label);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.app b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}
.app span{display:block;font-size:12px;color:var(--label2)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--label2);font-size:14.5px;font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--fill2);color:var(--label)}
.nav button[aria-current="page"]{background:var(--card);color:var(--label);box-shadow:var(--shadow)}
:root[data-theme="dark"] .nav button[aria-current="page"]{background:var(--card2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav button[aria-current="page"]{background:var(--card2)}}
.nav kbd{margin-left:auto;font-family:inherit;font-size:11px;color:var(--label3);border:1px solid var(--sep);border-radius:5px;padding:0 5px}
.side .grow{flex:1}
.side .foot{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--sep);padding-top:10px}

.content{min-width:0}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 32px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--sep)}
.crumb{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--label2);white-space:nowrap}
.crumb b{color:var(--label);font-weight:600}
.search{margin-left:auto;position:relative;width:min(340px,100%)}
.search input{width:100%;border:0;background:var(--fill);border-radius:12px;padding:9px 12px 9px 36px;font-size:14px;outline:none}
.search input::placeholder{color:var(--label2)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--label2)}
.results{position:absolute;right:0;top:calc(100% + 8px);width:min(420px,90vw);background:var(--card);border:1px solid var(--sep);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.18);padding:6px;display:none;max-height:60vh;overflow:auto}
.results.on{display:block;animation:pop .18s ease-out}
.results button{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer}
.results button:hover,.results button.hi{background:var(--fill2)}
.results i{width:8px;height:8px;border-radius:50%}
.results .t{font-size:14px;font-weight:500}
.results .m{font-size:12px;color:var(--label2)}
.results .mo{font-size:12px;color:var(--label2);white-space:nowrap}
.results .none{padding:14px;color:var(--label2);font-size:13px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}

.page{max-width:1180px;margin:0 auto;padding:10px 32px 80px}
.head{display:flex;align-items:center;gap:16px;margin:10px 0 24px}
.badge{width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.badge svg{width:28px;height:28px}
.head h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.head p{margin:3px 0 0;color:var(--label2);font-size:16px}
.head .total{margin-left:auto;text-align:right}
.head .total .v{font-size:30px;font-weight:700;letter-spacing:-.025em}
.head .total .l{font-size:13px;color:var(--label2)}

/* timeline scrubber */
.tl{background:var(--card);border-radius:var(--r);padding:20px 22px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.tl-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tl-top h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--label2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tl-scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
.cols{display:grid;grid-template-columns:repeat(8,minmax(76px,1fr));gap:10px;min-width:680px;position:relative}
.col{border:0;background:none;padding:6px 0 4px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:background .15s}
.col:hover{background:var(--fill2)}
.col .v{font-size:13px;font-weight:600;color:var(--label2);height:18px;white-space:nowrap}
.col .v small{font-size:11px;font-weight:600;margin-left:3px}
.col .cap{position:relative;width:34px;height:128px;border-radius:12px;background:var(--fill2);display:flex;align-items:flex-end;justify-content:center;overflow:visible}
.col .fill{width:100%;border-radius:12px;background:var(--label3);transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transition:background .2s}
.col .ghost{position:absolute;left:-4px;right:-4px;bottom:-4px;border:1.5px dashed var(--label2);border-radius:15px;pointer-events:none}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.col .m{font-size:13px;font-weight:600}
.col .p{font-size:11.5px;color:var(--label2);text-align:center;line-height:1.25;min-height:28px;padding:0 2px}
.col.win .fill{background:var(--accent)}
.col[aria-current="true"] .fill{background:var(--label)}
.col[aria-current="true"] .v{color:var(--label)}
.col:hover .fill{filter:brightness(1.08)}
.winline{grid-column:3 / 6;grid-row:2;height:3px;border-radius:2px;background:var(--accent);margin:4px 18px 0;position:relative}
.winline span{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--accent);white-space:nowrap}
.col.cmp .fill{background:var(--g0)}
.col.cmp[aria-current="true"] .fill{background:var(--label)}

/* cards / bento */
.view{animation:fadein .35s ease-out both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--card);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);min-width:0;position:relative}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em}
.card .sub{margin:3px 0 0;font-size:13px;color:var(--label2)}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stat .k{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--label2);font-weight:500}
.stat .k i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--fill)}
.stat .k i svg{width:13px;height:13px}
.stat .v{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:12px 0 2px;line-height:1.05}
.stat .d{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.stat .d span{color:var(--label2);font-weight:500}
.ticks{display:flex;gap:3px;height:34px;margin-top:16px;align-items:stretch}
.ticks i{flex:1;border-radius:3px;background:var(--fill);transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.8,.2,1) both}
.ticks i.on{background:var(--accent)}
.ring{width:84px;height:84px;position:absolute;right:20px;top:20px}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--fill)}
.ring .fg{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring text{font-size:17px;font-weight:700;fill:var(--label);text-anchor:middle;dominant-baseline:central;font-family:inherit}
.minibars{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:14px}
.minibars i{flex:1;border-radius:4px;background:var(--fill);transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
.minibars i.on{background:var(--label)}

.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;position:relative}
.seg button{border:0;background:none;border-radius:8px;padding:5px 13px;font-size:13px;font-weight:500;cursor:pointer;position:relative;z-index:1;color:var(--label);transition:color .2s}
.seg .knob{position:absolute;top:2px;bottom:2px;border-radius:8px;background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:left .28s cubic-bezier(.3,.7,.2,1),width .28s cubic-bezier(.3,.7,.2,1)}
:root[data-theme="dark"] .seg .knob{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg .knob{background:#636366}}
.chart{width:100%;height:320px;overflow:hidden}
.hs{overflow-x:auto;margin:0 -6px;padding:0 6px}
.hs .chart{min-width:720px}
.nochart{height:100%;display:grid;place-items:center;color:var(--label2);font-size:13px;text-align:center;border-radius:14px;background:var(--fill2);padding:20px}

/* group rows (screen-time style) */
.rows{display:grid;gap:4px}
.gr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border:0;background:none;text-align:left;padding:9px 10px;margin:0 -10px;border-radius:12px;cursor:pointer;transition:background .15s}
.gr:hover{background:var(--fill2)}
.gr[aria-pressed="true"]{background:var(--fill)}
.gr .n{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500}
.gr .n i{width:10px;height:10px;border-radius:50%}
.gr .a{font-size:14px;font-weight:600}
.gr .t{grid-column:1 / 3;height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.gr .t b{display:block;height:100%;border-radius:3px;transform-origin:left;animation:growx .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:14px 0 6px}
.stack b{display:block;height:100%;transition:opacity .2s}
.stack.dim b:not(.on){opacity:.25}

/* months */
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.mhead h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.025em}
.mhead p{margin:3px 0 0;color:var(--label2)}
.pager{display:flex;gap:8px}
.pbtn{border:0;background:var(--fill);border-radius:999px;height:34px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;cursor:pointer}
.pbtn:hover{background:var(--fill2);filter:brightness(.97)}
.pbtn:disabled{opacity:.35;cursor:default}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 14px}
.filters select,.filters input{border:0;background:var(--fill);border-radius:10px;padding:8px 12px;font-size:13.5px;outline:none}
.filters input{flex:1;min-width:180px}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--label);color:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer}
.count{margin-left:auto;font-size:13px;color:var(--label2)}
.group-h{font-size:13px;font-weight:600;color:var(--label2);margin:18px 4px 8px}
.inset{background:var(--card2);border-radius:16px;overflow:hidden}
.card .inset{background:var(--fill2)}
.act{border-bottom:1px solid var(--sep)}
.act:last-child{border-bottom:0}
.act summary{list-style:none;display:grid;grid-template-columns:10px 1fr auto 14px;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.act summary::-webkit-details-marker{display:none}
.act summary .dot{width:10px;height:10px;border-radius:50%}
.act .tt{font-size:14.5px;font-weight:500}
.act .mt{font-size:12.5px;color:var(--label2)}
.act .chev{width:14px;height:14px;color:var(--label3);transition:transform .2s}
.act[open] .chev{transform:rotate(90deg)}
.act.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--g0) 16%,transparent)}100%{background:transparent}}
.st{border:0;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:500;background:var(--fill);cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center}
.st.Done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.st.InProgress{background:color-mix(in srgb,var(--g1) 20%,transparent);color:color-mix(in srgb,var(--g1) 80%,var(--label))}
.st.OnHold{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.st.Dropped{color:var(--label3);text-decoration:line-through}
.act .body{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;padding:0 16px 16px 36px;font-size:14px}
.act .body span{display:block;font-size:12px;color:var(--label2);margin-bottom:2px}
.act.done .tt{color:var(--label2);text-decoration:line-through}
.empty{color:var(--label2);font-size:14px;padding:16px}

/* compare */
.take{font-size:19px;line-height:1.5;letter-spacing:-.015em;color:var(--label2);max-width:74ch;margin:4px 0 20px}
.take b{color:var(--label);font-weight:600}
.up{color:var(--pos)} .down{color:var(--neg)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-size:12.5px;color:var(--label2);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--sep)}
.t th:first-child,.t td:first-child{text-align:left}
.t td{padding:11px 10px;border-bottom:1px solid var(--sep);text-align:right}
.t tr:last-child td{border-bottom:0}
.t tr.sum td{font-weight:700}
.t td small{display:block;color:var(--label2);font-size:12px;max-width:52ch}
.foot-note{font-size:12.5px;color:var(--label2);margin:18px 4px 0;max-width:90ch}

/* tooltip for timeline */
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--card);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 0 .5px var(--sep);padding:12px 14px;width:230px;font-size:13px;opacity:0;transform:translateY(4px) scale(.98);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
.tip h4{margin:0;font-size:15px;font-weight:600}
.tip .s{color:var(--label2);margin:2px 0 8px}
.tip .r{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center;margin-top:5px}
.tip .r i{width:8px;height:8px;border-radius:50%}

/* mobile tab bar */
.tabbar{display:none}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.15),0 0 0 .5px var(--sep);padding:6px}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:16px;font-size:11px;font-weight:500;color:var(--label2);cursor:pointer}
  .tabbar button[aria-current="page"]{color:var(--label);background:var(--fill2)}
  .s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}
  .s3.half{grid-column:span 6}
  .page{padding:8px 16px 110px}
  .bar{padding:12px 16px}
}
@media (max-width:600px){
  .head h1{font-size:24px}.head .total{display:none}.badge{width:46px;height:46px}
  .s3.half{grid-column:span 12}
  .crumb span.c1{display:none}
  .act .body{grid-template-columns:1fr;padding-left:16px}
  .stat .v{font-size:28px}
  .ring{width:70px;height:70px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Navigation">
    <div class="app">
      <div class="logo"><svg viewBox="0 0 20 20" fill="none"><path d="M6 14 14 6M8 6h6v6" stroke="var(--card)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>AMAAVI</b><span>Sabarmati HSR Hub</span></div>
    </div>

/* ================= COMPARE ================= */
function cmpItems(){
  const reg = MKT.filter(c => !c.buffer), mk = [];
  [...new Set([...reg.map(c => c.name), ...Object.keys(P.mkt)])].forEach(n => { const c = reg.find(x => x.name === n);
    mk.push({name:n, sec:"mkt", past:P.mkt[n] || Z8(), now:c ? c.vals : Z8(), tag:!P.mkt[n] ? "New line" : ""}); });
  mk.push({name:"Marketing buffer", sec:"mkt", past:P.mktBuffer, now:MKT.find(c => c.buffer).vals, tag:"5% before, 3% now"});
  const ev = EVT.filter(c => !c.buffer).map(c => ({name:c.name, sec:"evt", past:P.event[c.name] || Z8(), now:c.vals, note:P.notes[c.name] || ""}));
  ev.push({name:"Launch event buffer", sec:"evt", past:P.eventBuffer, now:EVT.find(c => c.buffer).vals, tag:"5% before, 3% now"});
  [...mk, ...ev].forEach(x => { x.pt = sumA(x.past); x.nt = sumA(x.now); x.d = x.nt - x.pt; });
  return {mk, ev};
}
function vCompare(){
  const {mk, ev} = cmpItems(), all = [...mk, ...ev], dT = grand - pastGrand;
  const pE = sumA(ev.map(x => x.pt)), nE = sumA(ev.map(x => x.nt));
  const cuts = all.filter(x => x.d < -0.004).sort((a,b) => a.d - b.d), ups = all.filter(x => x.d > 0.004).sort((a,b) => b.d - a.d);
  const li = a => a.map(x => `${esc(x.name)} (${sgn(x.d)})`), and = a => a.length < 2 ? a.join("") : a.slice(0,-1).join(", ") + " and " + a[a.length-1];
  const nRows = (S.cf === "mkt" ? mk : S.cf === "evt" ? ev : all).length;
  return `<div class="view">
  <p class="take">The new plan spends <b class="tn">${L(grand)}</b> against <b class="tn">${L(pastGrand)}</b> in the Aug 2026 plan, <b class="${dc(dT)} tn">${sgn(dT)}</b> or ${Math.abs(dT/pastGrand*100).toFixed(1)}% less. The biggest cuts are ${and(li(cuts.slice(0,3)))}. ${ups.length ? (ups.length === 1 ? "The only increase is " : "It adds ") + and(li(ups.slice(0,3))) + "." : ""}</p>
  <div class="bento">
    <div class="card s4 stat"><div class="k"><i>${ICON.sum}</i>Past plan</div><div class="v tn">${N(pastGrand)}</div><div class="d"><span>Aug 2026, Oct to May</span></div></div>
    <div class="card s4 stat"><div class="k"><i>${ICON.sum}</i>New plan</div><div class="v tn">${N(grand)}</div><div class="d"><span>Revised, Oct to May</span></div></div>
    <div class="card s4 stat"><div class="k"><i>${ICON.peak}</i>Change</div><div class="v tn down">${sgn(dT)}</div><div class="d tn"><span>Launch event ${sgn(nE - pE)}</span></div></div>

    <div class="card s7"><div class="ctop"><div><h3>Month by month</h3><p class="sub">Dashed is the past plan. Hover to see the gap.</p></div></div><div class="chart" id="k1"></div></div>
    <div class="card s5"><div class="ctop"><div><h3>From past to new</h3><p class="sub">The largest moves, in order.</p></div></div><div class="chart" id="k2"></div></div>
    <div class="card s12"><div class="ctop"><div><h3>Every line</h3><p class="sub">Change across the eight months. Left is lower than before, right is higher.</p></div>${seg("cf", [["all","All"],["mkt","Marketing"],["evt","Launch event"]], S.cf)}</div>
      <div class="hs"><div class="chart" id="k3" style="height:${nRows*28 + 30}px"></div></div></div>
    <div class="card s12"><div class="ctop"><div><h3>Launch event, line by line</h3><p class="sub">PM launch event, with PM scenario.</p></div></div>
      <div class="hs"><table class="t tn" style="min-width:560px"><thead><tr><th>Item</th><th>Past</th><th>New</th><th>Change</th></tr></thead><tbody>
      ${ev.map(x => `<tr><td>${esc(x.name)}${x.note ? `<small>${esc(x.note)}</small>` : ""}</td><td>${fmt(x.pt)}</td><td>${fmt(x.nt)}</td><td class="${dc(x.d)}">${Math.abs(x.d) < .005 ? "-" : sgn(x.d)}</td></tr>`).join("")}
      <tr class="sum"><td>Total</td><td>${fmt(pE)}</td><td>${fmt(nE)}</td><td class="${dc(nE - pE)}">${sgn(nE - pE)}</td></tr></tbody></table></div></div>
  </div>
  <p class="foot-note">Both plans are compared for Oct 2026 to May 2027. The past plan's earlier ${L(pastPre)} (Apr to Sep 2026) is left out. The past plan used a 5% buffer; the revised plan uses 3%. Past line names were matched to the new ones, and past Mega IPs are compared as placed in the Mar to May columns.</p>
  </div>`;
}

  mount("k1", {
    grid:{left:6, right:28, top:20, bottom:40, containLabel:true},
    legend:{bottom:0, icon:"circle", itemWidth:8, itemHeight:8, textStyle:{color:cssv("--label2")}},
    tooltip:{trigger:"axis", axisPointer:{type:"line", lineStyle:{color:cssv("--label3"), type:"dashed"}}, formatter:ps => { const i = ps[0].dataIndex, d = T[i] - PT[i];
      return th(MONTHS[i]) + tr(cssv("--label3"), "Past plan", fmt(PT[i])) + tr(acc, "New plan", fmt(T[i])) + `<div style="margin-top:6px;font-weight:600;color:${d < 0 ? cssv("--neg") : cssv("--pos")}">${sgn(d)}</div>`; }},
    xAxis:{type:"category", data:SHORT, boundaryGap:false, ...ax(), splitLine:{show:false}},
    yAxis:{type:"value", ...ax()},
    series:[
      {name:"Past plan", type:"line", smooth:.4, data:PT.map(r2), symbol:"none", lineStyle:{width:2, type:[6,5], color:cssv("--label2")},
       areaStyle:{color:{image:(() => { const c = document.createElement("canvas"); c.width = c.height = 8; const x = c.getContext("2d"); x.strokeStyle = alpha(cssv("--label2").startsWith("#") ? cssv("--label2") : "#8e8e93", .28); x.lineWidth = 1; x.beginPath(); x.moveTo(0,8); x.lineTo(8,0); x.stroke(); return c; })(), repeat:"repeat"}}},
      {name:"New plan", type:"line", smooth:.4, data:T.map(r2), symbolSize:8, lineStyle:{width:3.5, color:acc, shadowBlur:16, shadowColor:alpha(acc,.4)}, itemStyle:{color:acc, borderColor:cssv("--card"), borderWidth:2},
       areaStyle:{color:{type:"linear",x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:alpha(acc,.22)},{offset:1,color:alpha(acc,0)}]}}}
    ]}, p => openMonth(p.dataIndex));

  const sorted = all.filter(x => Math.abs(x.d) > .004).sort((a,b) => Math.abs(b.d) - Math.abs(a.d));
  const top = sorted.slice(0,8), rest = sorted.slice(8), steps = [...top.map(x => ({n:x.name, d:x.d})), ...(rest.length ? [{n:`${rest.length} other lines`, d:sumA(rest.map(x => x.d))}] : [])];
  const cats = ["Past plan", ...steps.map(s => s.n), "New plan"], bs = [0], dn = ["-"], up = ["-"], tt = [r2(pastGrand)];
  let run = pastGrand; steps.forEach(s => { const nx = run + s.d; bs.push(r2(Math.min(run, nx))); s.d < 0 ? (dn.push(r2(-s.d)), up.push("-")) : (up.push(r2(s.d)), dn.push("-")); tt.push("-"); run = nx; });
  bs.push(0); dn.push("-"); up.push("-"); tt.push(r2(grand));
  const mn = Math.floor((grand - 60)/100)*100;
  mount("k2", {
    grid:{left:150, right:52, top:6, bottom:28},
    tooltip:{trigger:"axis", axisPointer:{type:"shadow", shadowStyle:{color:cssv("--fill2")}}, formatter:ps => { const k = ps[0].dataIndex;
      if (k === 0) return th("Past plan") + L(pastGrand); if (k === cats.length - 1) return th("New plan") + L(grand); const s = steps[k-1]; return th(s.n) + sgn(s.d); }},
    yAxis:{type:"category", data:cats, inverse:true, ...ax(), axisLabel:{color:cssv("--label"), fontSize:12, width:140, overflow:"truncate"}},
    xAxis:{type:"value", min:mn, ...ax(), name:"Axis from ₹" + mn + " L", nameLocation:"middle", nameGap:22, nameTextStyle:{color:cssv("--label3"), fontSize:11}},
    series:[
      {type:"bar", stack:"w", data:bs, itemStyle:{color:"transparent"}, silent:true, emphasis:{disabled:true}},

      {type:"bar", stack:"w", data:up, itemStyle:{color:cssv("--pos"), borderRadius:5}, label:{show:true, position:"right", color:cssv("--pos"), fontSize:11.5, fontWeight:600, formatter:p => p.value === "-" ? "" : "+" + nf(p.value)}},
      {type:"bar", stack:"w", data:tt, barWidth:"58%", itemStyle:{color:p => p.dataIndex === 0 ? cssv("--label3") : acc, borderRadius:5}, label:{show:true, position:"right", color:cssv("--label"), fontWeight:700, fontSize:12, formatter:p => p.value === "-" ? "" : nf(p.value)}}
    ]});

  const rows = (S.cf === "mkt" ? mk : S.cf === "evt" ? ev : all).slice().sort((a,b) => b.d - a.d);
  mount("k3", {

    xAxis:{type:"value", ...ax()},
    yAxis:{type:"category", data:rows.map(x => x.name), inverse:true, ...ax(), axisLabel:{color:cssv("--label"), fontSize:12.5, width:214, overflow:"truncate"}},
    series:[{type:"bar", barWidth:12, data:rows.map(x => ({value:r2(x.d), itemStyle:{color:x.d < -.004 ? cssv("--neg") : x.d > .004 ? cssv("--pos") : cssv("--fill"), borderRadius:6}})),

/* ================= SEARCH ================= */
const INDEX = MONTHS.flatMap((m,mi) => DATA.acts[m].map((a,k) => ({mi, k, a})));
let hi = -1;
function search(){
  const q = document.getElementById("q").value.trim().toLowerCase(), box = document.getElementById("results");
  if (!q){ box.classList.remove("on"); return; }
  const res = INDEX.filter(x => (x.a.act + " " + x.a.cat + " " + x.a.det).toLowerCase().includes(q)).slice(0, 12);
  hi = res.length ? 0 : -1;
  box.innerHTML = res.length ? res.map((x,j) => `<button data-j="${j}" class="${j === 0 ? "hi" : ""}"><i style="background:${gcol(catGroup[x.a.cat] || "Buffer")}"></i><span><span class="t">${esc(x.a.act)}</span><br><span class="m">${esc(x.a.cat)}</span></span><span class="mo">${SHORT[x.mi]}</span></button>`).join("")
    : `<div class="none">No activity matches "${esc(q)}".</div>`;
  box.classList.add("on");
  box.querySelectorAll("button").forEach(b => b.addEventListener("mousedown", e => { e.preventDefault(); pick(res[+b.dataset.j]); }));
  box._res = res;
}
function pick(x){ if (!x) return; const box = document.getElementById("results"); box.classList.remove("on"); document.getElementById("q").value = ""; document.getElementById("q").blur();
  S.view = "months"; S.month = x.mi; S.focus = null; S.openAct = x.k; save(); render(); }

/* ================= RENDER ================= */
function render(){
  untip(); kill(); buildTimeline(); syncNav();
  const main = document.getElementById("main");
  if (S.view === "overview"){ main.innerHTML = vOverview(); cOverview();
    main.querySelectorAll(".gr[data-g]").forEach(b => b.addEventListener("click", () => { S.group = S.group === b.dataset.g ? null : b.dataset.g; if (S.mode === "group" && S.group) S.mode = "total"; render(); }));
  } else if (S.view === "months"){ main.innerHTML = vMonths();
    main.querySelector("#prev").addEventListener("click", () => openMonth(S.month - 1));
    main.querySelector("#next").addEventListener("click", () => openMonth(S.month + 1));
    main.querySelectorAll(".gr[data-cat]").forEach(b => b.addEventListener("click", () => { S.focus = S.focus === b.dataset.cat ? null : b.dataset.cat; main.querySelectorAll(".gr[data-cat]").forEach(x => x.setAttribute("aria-pressed", x.dataset.cat === S.focus)); renderActs(); }));
    ["fq","fs"].forEach(id => document.getElementById(id).addEventListener("input", renderActs));
    renderActs();
  } else { main.innerHTML = vCompare(); cCompare(); }
  main.querySelectorAll(".seg").forEach(s => s.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const n = s.dataset.seg, k = b.dataset.k; if (n === "mode"){ S.mode = k; if (k === "group") S.group = null; } else if (n === "heat") S.heat = k; else if (n === "cf") S.cf = k; render(); })));
  placeKnobs(main); countUp(main);
  requestAnimationFrame(() => main.querySelectorAll(".ring .fg").forEach(c => c.style.strokeDashoffset = c.dataset.off));
}

/* ---------- wiring ---------- */
document.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => go(b.dataset.v)));
function toggleTheme(){ const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("amaavi-theme", r.dataset.theme); } catch(e) {} themeLbl(); render(); }
function themeLbl(){ const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; document.getElementById("themeLbl").textContent = dark ? "Light appearance" : "Dark appearance"; }
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.querySelector("[data-theme-toggle]").addEventListener("click", toggleTheme);
try { const t = localStorage.getItem("amaavi-theme"); if (t) document.documentElement.dataset.theme = t; } catch(e) {}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!document.documentElement.dataset.theme){ themeLbl(); render(); } });
document.getElementById("resetBtn").addEventListener("click", () => { const l = document.getElementById("resetLbl");
  if (!l.dataset.armed){ l.dataset.armed = 1; l.textContent = "Select again to confirm"; setTimeout(() => { delete l.dataset.armed; l.textContent = "Reset statuses"; }, 3500); return; }
  delete l.dataset.armed; l.textContent = "Reset statuses"; statuses = {}; try { localStorage.removeItem(SKEY); } catch(e) {} render(); });
const q = document.getElementById("q");
q.addEventListener("input", search);
q.addEventListener("focus", search);
q.addEventListener("blur", () => setTimeout(() => document.getElementById("results").classList.remove("on"), 120));
q.addEventListener("keydown", e => { const box = document.getElementById("results"), res = box._res || [];
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); if (!res.length) return; hi = (hi + (e.key === "ArrowDown" ? 1 : -1) + res.length) % res.length; box.querySelectorAll("button").forEach((b,j) => b.classList.toggle("hi", j === hi)); }
  if (e.key === "Enter"){ e.preventDefault(); pick(res[hi]); }
  if (e.key === "Escape"){ q.value = ""; box.classList.remove("on"); q.blur(); } });
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey){ if (e.key === "k"){ e.preventDefault(); q.focus(); } return; }
  if (e.target.closest("input,select,textarea")) return;
  if (e.key === "/"){ e.preventDefault(); q.focus(); }
  if (e.key === "1") go("overview"); if (e.key === "2") go("months"); if (e.key === "3") go("compare");
  if (S.view === "months" && e.key === "ArrowRight" && S.month < 7) openMonth(S.month + 1);
  if (S.view === "months" && e.key === "ArrowLeft" && S.month > 0) openMonth(S.month - 1);
});
addEventListener("scroll", () => document.getElementById("bar").classList.toggle("scrolled", scrollY > 4), {passive:true});
addEventListener("resize", () => placeKnobs(document));
document.getElementById("totalV").textContent = L(grand);
themeLbl(); render();
</script>
